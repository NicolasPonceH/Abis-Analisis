<section class="doc-scanner" data-document-scanner aria-label="Demostración animada del escaneo de documentos">
  <div class="doc-scanner__heading">
    <span><i></i> INTELIGENCIA DOCUMENTAL</span>
    <span class="doc-scanner__demo">DEMO OCR</span>
  </div>
  <div class="doc-scanner__viewport" aria-hidden="true">
    <div class="doc-scanner__grid"></div>
    <div class="doc-scanner__scene">
      <div class="doc-scanner__base">
        <div class="doc-scanner__glass"></div>
        <span class="doc-scanner__corner doc-scanner__corner--tl"></span>
        <span class="doc-scanner__corner doc-scanner__corner--tr"></span>
        <span class="doc-scanner__corner doc-scanner__corner--bl"></span>
        <span class="doc-scanner__corner doc-scanner__corner--br"></span>
      </div>
      <div class="doc-scanner__front"><b>SIAD</b><span>OPTICAL SCANNER</span><i></i><i></i><i></i></div>
      <div class="doc-scanner__side"></div>
      <div class="doc-scanner__paper-shadow"></div>
      <div class="doc-scanner__paper">
        <div class="doc-scanner__paper-header"><b>SIAD</b><span>DOCUMENTO<br>DE MUESTRA</span></div>
        <div class="doc-scanner__paper-title">ANÁLISIS DOCUMENTAL</div>
        <div class="doc-scanner__line doc-scanner__line--short"></div>
        <div class="doc-scanner__field doc-scanner__field--one"><span>01</span><i></i><i></i></div>
        <div class="doc-scanner__field doc-scanner__field--two"><span>02</span><i></i><i></i></div>
        <div class="doc-scanner__field doc-scanner__field--three"><span>03</span><i></i><i></i></div>
        <div class="doc-scanner__paper-footer"><span class="doc-scanner__barcode"></span><span>OCR / SIAD</span></div>
        <div class="doc-scanner__beam"></div>
      </div>
      <div class="doc-scanner__result"><span>✓</span><div>TEXTO RECONOCIDO<small>Documento digitalizado</small></div></div>
    </div>
    <div class="doc-scanner__caption"><span></span> CAPTURA · LECTURA · ANÁLISIS</div>
  </div>
  <div class="doc-scanner__steps" aria-hidden="true">
    <span class="doc-scanner__step doc-scanner__step--one"><b>01</b> Escaneo</span>
    <span class="doc-scanner__step doc-scanner__step--two"><b>02</b> Lectura OCR</span>
    <span class="doc-scanner__step doc-scanner__step--three"><b>03</b> Extracción</span>
  </div>
  <div class="doc-scanner__bottom">
    <p>Del documento a la información.</p>
    <button class="doc-scanner__toggle" type="button" aria-pressed="false" aria-label="Pausar animación del escáner">Pausar</button>
  </div>
</section>
